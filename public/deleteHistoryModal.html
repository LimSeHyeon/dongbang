<!DOCTYPE html>
<html class="light" lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>예약 삭제 히스토리</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="js/tailwind.config.js"></script>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-white min-h-screen flex overflow-hidden">
    <div class="absolute inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-[#1e2a38] rounded-2xl shadow-2xl w-full max-w-4xl max-h-[85vh] flex flex-col overflow-hidden animate-fade-in border border-slate-200 dark:border-slate-700">
            <!-- Modal Header -->
            <div class="px-6 py-5 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between bg-white dark:bg-[#1e2a38] sticky top-0 z-10">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-red-500/10 flex items-center justify-center text-red-500">
                        <span class="material-symbols-outlined">delete_forever</span>
                    </div>
                    <div>
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white">예약 삭제 히스토리</h3>
                        <p class="text-sm text-slate-500 dark:text-slate-400">과거 예약 삭제 내역에 대한 상세 기록입니다.</p>
                    </div>
                </div>
                <div class="flex items-center gap-1">
                    <button id="delete-history-refresh-btn" class="w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-center text-slate-500 transition-colors" title="새로고침">
                        <span class="material-symbols-outlined">refresh</span>
                    </button>
                    <button class="w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-center text-slate-500 transition-colors js-close-modal">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
            </div>

            <!-- Modal Content -->
            <div class="overflow-y-auto p-6 flex-1 bg-slate-50/50 dark:bg-[#1a2632]/50">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div class="bg-white dark:bg-[#1e2a38] p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">총 삭제 건수</div>
                        <div class="flex items-end gap-2">
                            <span id="delete-history-total-count" class="text-2xl md:text-3xl font-bold text-red-500">-</span>
                            <span class="text-xs md:text-sm font-medium text-slate-500 mb-1.5">건</span>
                        </div>
                    </div>
                    <div class="bg-white dark:bg-[#1e2a38] p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">기간</div>
                        <div class="flex items-center gap-2 mt-1 md:mt-2">
                            <span class="material-symbols-outlined text-slate-400 text-lg">date_range</span>
                            <span class="text-sm font-medium text-slate-700 dark:text-slate-300">최근 7일</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white dark:bg-[#1e2a38] rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
                    <!-- Desktop Table View -->
                    <div class="hidden md:block overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700">
                                    <th class="py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">곡명</th>
                                    <th class="py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider w-44">예약 시작 시간</th>
                                    <th class="py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider w-44">예약 종료 시간</th>
                                    <th class="py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider w-44">삭제 시간</th>
                                </tr>
                            </thead>
                            <tbody id="delete-history-table-body" class="divide-y divide-slate-100 dark:divide-slate-700">
                                <!-- Dynamic Content -->
                            </tbody>
                        </table>
                    </div>
                    <!-- Mobile List View -->
                    <div id="delete-history-mobile-list" class="md:hidden space-y-0 divide-y divide-slate-100 dark:divide-slate-700">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="p-6 border-t border-slate-100 dark:border-slate-700 bg-white dark:bg-[#1e2a38] flex items-center justify-end gap-3">
                <button class="px-5 py-2.5 rounded-lg bg-red-500 hover:bg-red-600 text-white font-medium text-sm transition-colors shadow-sm hover:shadow js-close-modal">
                    닫기
                </button>
            </div>
        </div>
    </div>
</body>

</html>
