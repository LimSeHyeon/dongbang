<!-- Backdrop -->
<div class="fixed inset-0 bg-black/30 backdrop-blur-sm transition-opacity js-backdrop"></div>

<!-- Modal Content Wrapper -->
<div id="mobile-day-modal-content" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center pointer-events-none px-0 sm:px-4 pb-0 sm:pb-4">
    
    <!-- Actual Modal Card -->
    <div class="pointer-events-auto relative w-full sm:w-[400px] bg-white dark:bg-[#1a2632] rounded-t-2xl sm:rounded-2xl shadow-2xl flex flex-col max-h-[75vh] animate-in slide-in-from-bottom duration-300">
        
        <!-- Header with Navigation -->
        <div class="px-4 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center shrink-0 gap-3">
            
            <!-- Date Navigation -->
            <div class="flex items-center flex-1 justify-between bg-slate-50 dark:bg-[#15202b] rounded-lg p-1">
                <button class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white dark:hover:bg-slate-700 shadow-sm text-slate-500 dark:text-slate-400 transition-all disabled:opacity-30 disabled:hover:bg-transparent js-prev-day">
                    <span class="material-symbols-outlined text-lg">chevron_left</span>
                </button>
                
                <div class="text-center">
                    <h3 id="mobile-modal-date" class="text-base font-bold text-slate-900 dark:text-white">
                        <!-- JS filled -->
                    </h3>
                </div>

                <button class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white dark:hover:bg-slate-700 shadow-sm text-slate-500 dark:text-slate-400 transition-all disabled:opacity-30 disabled:hover:bg-transparent js-next-day">
                    <span class="material-symbols-outlined text-lg">chevron_right</span>
                </button>
            </div>

            <!-- Close Button -->
            <button class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 transition-colors js-close-modal shrink-0">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <!-- Body -->
        <div id="mobile-modal-list" class="flex-1 overflow-y-auto p-4 space-y-3 min-h-[150px] overscroll-contain">
            <!-- Content Injected via JS -->
        </div>
        
        <!-- Footer -->
        <div class="p-4 border-t border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-[#15202b]/50 rounded-b-none sm:rounded-b-2xl">
             <button class="w-full py-3.5 px-4 bg-primary hover:bg-primary/90 text-white rounded-xl font-bold text-sm shadow-sm transition-transform active:scale-[0.98] js-close-modal">
                확인
            </button>
        </div>
    </div>
</div>
