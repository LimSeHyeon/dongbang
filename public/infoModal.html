<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity js-backdrop"></div>
    <div class="relative w-full max-w-sm transform overflow-hidden rounded-xl bg-white dark:bg-[#1a2632] shadow-2xl transition-all border border-slate-100 dark:border-slate-800">
        <button class="absolute right-4 top-4 rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-500 dark:hover:bg-slate-800 dark:hover:text-slate-300 transition-colors js-close-modal">
            <span class="material-symbols-outlined text-xl">close</span>
        </button>
        <div class="p-6">
            <div class="text-center">
                <h3 class="info-title text-xl font-bold text-slate-900 dark:text-white mb-1"></h3>
                <p class="text-xs text-slate-500 dark:text-slate-400">예약 상세 정보</p>
            </div>
            <div class="mt-6 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-[#101922] p-4 flex items-start gap-4 shadow-sm">
                <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-purple-100 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400">
                    <span class="material-symbols-outlined text-xl">music_note</span>
                </div>
                <div class="flex-1 min-w-0 flex flex-col justify-center">
                    <div class="flex flex-col gap-2 text-sm text-slate-500 dark:text-slate-400">
                        <span class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-[16px]">calendar_today</span>
                            <span class="info-day font-medium text-slate-700 dark:text-slate-200"></span>
                        </span>
                        <span class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-[16px]">schedule</span>
                            <span class="info-time font-medium text-slate-700 dark:text-slate-200"></span>
                        </span>
                    </div>
                </div>
            </div>
            <div class="mt-6">
                <button class="js-delete-btn inline-flex w-full items-center justify-center rounded-lg bg-red-50 dark:bg-red-900/20 px-4 py-2.5 text-sm font-semibold text-red-600 dark:text-red-400 shadow-sm hover:bg-red-100 dark:hover:bg-red-900/40 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition-colors">
                    <span class="material-symbols-outlined text-[18px] mr-2">delete</span>
                    예약 삭제
                </button>
                <button class="js-close-btn mt-2 inline-flex w-full items-center justify-center rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-transparent px-4 py-2.5 text-sm font-semibold text-slate-700 dark:text-slate-200 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2 transition-colors">
                    닫기
                </button>
            </div>
        </div>
    </div>
</div>
